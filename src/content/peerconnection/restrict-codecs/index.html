<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="description" content="WebRTC codec group restriction">
  <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1">
  <title>Restrict codecs by group</title>
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>
  <div id="container">
    <h1>Restrict codecs by group</h1>

    <div>
      <label for="codecPreferences">Codec group:</label>
      <select id="codecPreferences" disabled>
        <option value="">No preference</option>
      </select>
    </div>

    <video id="localVideo" playsinline autoplay muted></video>
    <video id="remoteVideo" playsinline autoplay></video>

    <div>
      <button id="startButton">Start</button>
      <button id="callButton">Call</button>
      <button id="hangupButton">Hang Up</button>
    </div>

    <div id="activeCodec"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
